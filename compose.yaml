name: Bounty

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bounty}
      POSTGRES_DB: ${POSTGRES_DB:-bounty}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bounty} -d ${POSTGRES_DB:-bounty}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  smee:
    build:
      context: ./github-app
      dockerfile: Dockerfile.smee
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SMEE_URL=${SMEE_URL}
    profiles:
      - github-app

volumes:
  postgres_data: